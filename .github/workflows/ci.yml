name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  minimum-swift:
    name: Minimum supported Swift (6.3.3)
    runs-on: ubuntu-latest
    container: swift:6.3.3-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Require Swift 6.3.3
        run: |
          swift --version
          swift --version | grep -F "Swift version 6.3.3"
      - name: Build without optional traits
        run: swift build --disable-default-traits
      - name: Test without optional traits
        run: swift test --disable-default-traits

  current-swift:
    name: Swift 6.4 (Xcode 27, default traits)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Require Swift 6.4
        run: |
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          [[ "$swift_version" == *"Swift version 6.4"* ]]
      - name: Build
        run: swift build --disable-default-traits
      - name: Run tests
        run: swift test --disable-default-traits

  mlx:
    name: Swift 6.4 native MLX trait (macOS 14+)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: |
          test "$(uname -m)" = arm64
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          [[ "$swift_version" == *"Swift version 6.4"* ]]
      - name: Ensure Metal compiler is installed
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build with native MLX trait
        run: swift build --traits MLX --triple arm64-apple-macosx14.0
      - name: Test with native MLX trait
        run: swift test --traits MLX --triple arm64-apple-macosx14.0
